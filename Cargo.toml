[package]
name = "oxidecord"
version = "0.5.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["webview"] }
gpui-component-assets = "0.5.1"
wry = { version = "0.53.3", package = "lb-wry" }
twilight-http = "0.17.1"
twilight-model = "0.17.1"
twilight-gateway = "0.17.1"
twilight-util = { version = "0.17.0", features = ["permission-calculator"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
futures = "0.3"
anyhow = "1.0.103"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots"] }
keyring = "4.1.5"
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tws"] }
cpal = "0.18.2"
opus2 = "0.4.0"
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
async-trait = "0.1.92"
# Go Live runs its own voice connection beside songbird's, which has no video
tokio-websockets = { version = "0.11", features = ["client", "fastrand", "sha1_smol", "simd", "ring", "rustls-native-roots"] }
davey = "0.1.4"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false }
emojis = "0.9.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.10.9"

# Video playback and screen capture go through Media Foundation and Direct3D,
# so no codec ships with the app
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
] }

# The capture test picks the primary display by monitor handle
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi"] }

[build-dependencies]
embed-resource = "3"

[patch.crates-io]
twilight-http = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-model = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-gateway = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-util = { git = "https://github.com/s1099/twilight", branch = "main" }

# Comment out if required while using debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0
