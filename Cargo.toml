[package]
name = "oxidecord"
version = "0.3.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["webview"] }
gpui-component-assets = "0.5.1"
wry = { version = "0.53.3", package = "lb-wry" }
twilight-http = "0.17.1"
twilight-model = "0.17.1"
twilight-gateway = "0.17.1"
twilight-util = { version = "0.17.0", features = ["permission-calculator"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
futures = "0.3"
anyhow = "1.0.103"
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = ["rustls-tls-native-roots"] }
keyring = "4.1.5"
# "gateway" is only here because songbird 0.6.0 declares dashmap under it while
# "receive" uses it, so receiving doesn't build without it. Its manager and Call
# types go unused: a DM call is guildless and theirs require a guild id.
songbird = { version = "0.6.0", default-features = false, features = ["driver", "gateway", "receive", "rustls", "tws"] }
cpal = "0.18.2"
# Songbird pulls symphonia in with every format and codec turned off, leaving
# the registry it hands the mixer empty. Sending the microphone needs the PCM
# decoder: the raw f32 adapter declares itself as PCM_F32LE, so without this
# the track is dropped as an unsupported codec and nothing is transmitted.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm"] }
async-trait = "0.1.92"
# Only for `ImageBuffer`/`Frame`, which gpui's `RenderImage` is built from.
# Default features off because gpui already pulls in the format decoders it
# wants and cargo unions them; nothing here needs to add to that.
image = { version = "0.25", default-features = false }

# Video playback goes through Media Foundation, so no codec ships with the app.
# The crate is already in the tree — this only turns on more of it.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[patch.crates-io]
twilight-http = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-model = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-gateway = { git = "https://github.com/s1099/twilight", branch = "main" }
twilight-util = { git = "https://github.com/s1099/twilight", branch = "main" }
